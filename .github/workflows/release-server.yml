name: release-server

on:
  push:
    tags: [ "governance-server-v*" ]

concurrency: aepp-governance_production_environment

jobs:
  publish-server:
    uses: aeternity/github-actions/.github/workflows/_publish-ecr.yml@v2.4.0
    secrets: inherit
    with:
      FILE: ./governance-server/Dockerfile
      CONTEXT: .
      BUILD_ARGS: |
        GIT_REV=${{ github.ref_name }}
      REPOSITORY: "aeternity/governance-server"
  deploy-server-mainnet:
    needs: [publish-server]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v5
        with:
          repository: aeternity/gitops-apps-aelabs.git
          token: ${{ secrets.BOT_GITHUB_TOKEN }}
          ref: prd
          persist-credentials: false
          fetch-depth: 0

      - name: Production Deploy
        uses: aeternity/ae-github-actions/argocd-deploy@v7.4.0
        with:
          git-sha: ${{ github.sha }}
          url-prefix: ${{ github.ref_name }}
          env: prd
          app: governance-server-mainnet

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          repository: aeternity/gitops-apps-aelabs
          github_token: ${{ secrets.BOT_GITHUB_TOKEN }}
          branch: prd
